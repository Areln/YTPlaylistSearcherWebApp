<mat-expansion-panel hideToggle (afterExpand)="loadComments()">
  <mat-expansion-panel-header>
    <mat-panel-title>
      Comments
    </mat-panel-title>
    <!--<mat-panel-description>
      This is a summary of the content
    </mat-panel-description>-->
  </mat-expansion-panel-header>

  <form [formGroup]="commentForm" (ngSubmit)="createComment()">
    <mat-form-field>
      <input matInput  mat-raised-button formControlName="commentInput" placeholder="Leave a comment...">
    </mat-form-field>

    <button mat-button type="submit">Submit</button>
  </form>


  <div *ngFor="let item of comments">
    <div>
      <div>{{item.user.userName}} @ {{item.createdDate}}</div>
      <div>{{item.comment}}</div>
      <button *ngIf="item.canDelete == true" mat-button (click)="deleteComment(item.id)">Delete</button>
    </div>
    <mat-divider></mat-divider>
  </div>

</mat-expansion-panel>
